<style>
  /* Layout shell */
  .app {
    display: grid;
    grid-template-columns: 200px 1fr 260px;
    grid-template-rows: 52px 1fr 26px;
    height: 100vh;
    width: 100vw;
    background: var(--bg-0);
  }
  .app.tweaks-off { grid-template-columns: 200px 1fr 0px; }
  @media (max-width: 1280px) {
    .app { grid-template-columns: 188px 1fr 240px; }
    .app.tweaks-off { grid-template-columns: 188px 1fr 0px; }
  }
  .app.tweaks-off .tweaks-col { display: none; }

  .topbar { grid-column: 1 / -1; }
  .statusbar { grid-column: 1 / -1; }

  .main-col {
    overflow: auto;
    padding: 16px;
    background:
      linear-gradient(var(--bg-0), var(--bg-0)),
      repeating-linear-gradient(0deg, transparent 0 23px, oklch(0.18 0.008 240 / 0.3) 23px 24px);
    background-blend-mode: normal;
  }
</style>
</head>
<body data-density="comfortable" data-scenario="midday" data-stage="2" data-forecast-style="band">

<div id="root"></div>

<!-- React + Babel (pinned versions; SRI removed — hashes in the original zip did not match the real unpkg artifacts) -->
